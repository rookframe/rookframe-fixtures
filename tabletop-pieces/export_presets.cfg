
[preset.0]
name="package"
custom_features="s3tc,bptc,etc2,astc"
platform="macOS"
runnable=false
dedicated_server=false
export_filter="selected_resources"
include_filter="rookframe/packages/cccccccc-cccc-4ccc-8ccc-cccccccccccc/**"
exclude_filter="rookframe.json,rookframe/ui/**,addons/**,.rookframe/**,.plugged/**,plug.gd,README.md,presentation/**,source/**,convert_bookshelf.gd,convert_bookshelf.gd.uid"
export_path="build/package.pck"
script_export_mode=0
encrypt_pck=false
encrypt_directory=false

[preset.0.options]
texture_format/s3tc_bptc=true
texture_format/etc2_astc=true
codesign/codesign=0
application/bundle_identifier="org.rookframe.package"
